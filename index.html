<!doctype html>
<html lang="en">
  <head>
    <!-- Primary Meta Tags -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Discover Minimal Store - curated collection of minimal, high-quality fashion pieces. Sustainable clothing, accessories, shoes and bags for the modern lifestyle." />
    <meta name="keywords" content="minimal fashion, sustainable clothing, modern style, quality basics, minimalist wardrobe, eco-friendly fashion" />
    <meta name="author" content="Minimal Store" />
    <meta name="robots" content="index, follow" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://e-commerce.netlify.app/" />
    <meta property="og:title" content="Minimal Store - Curated Fashion for Modern Living" />
    <meta property="og:description" content="Discover our collection of minimal, high-quality fashion pieces. Sustainable clothing and accessories for the modern lifestyle." />
    <meta property="og:image" content="https://e-commerce.netlify.app/og-image.jpg" />
    <meta property="og:site_name" content="Minimal Store" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://e-commerce.netlify.app/" />
    <meta name="twitter:title" content="Minimal Store - Curated Fashion for Modern Living" />
    <meta name="twitter:description" content="Discover our collection of minimal, high-quality fashion pieces. Sustainable clothing and accessories for the modern lifestyle." />
    <meta name="twitter:image" content="https://e-commerce.netlify.app/og-image.jpg" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://e-commerce.netlify.app/" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#000000" />
    
    <!-- Preconnect to external domains for performance -->
    <link rel="preconnect" href="https://images.pexels.com" />
    <link rel="dns-prefetch" href="https://images.pexels.com" />
    
    <!-- Title -->
    <title>Minimal Store - Curated Fashion for Modern Living | Sustainable Clothing & Accessories</title>
    
    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Minimal Store",
      "description": "Curated minimal fashion for the modern lifestyle",
      "url": "https://e-commerce.netlify.app/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://e-commerce.netlify.app/products?search={search_term_string}",
        "query-input": "required name=search_term_string"
      },
      "publisher": {
        "@type": "Organization",
        "name": "Minimal Store",
        "url": "https://e-commerce.netlify.app/",
        "logo": {
          "@type": "ImageObject",
          "url": "https://e-commerce.netlify.app/logo.png"
        }
      }
    }
    </script>
    
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Minimal Store",
      "url": "https://e-commerce.netlify.app/",
      "logo": "https://e-commerce.netlify.app/logo.png",
      "description": "Curated minimal fashion for the modern lifestyle",
      "sameAs": [
        "https://www.instagram.com/minimalstore",
        "https://www.facebook.com/minimalstore",
        "https://www.twitter.com/minimalstore"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Customer Service",
        "email": "support@minimalstore.com"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
